[project]
name = "localcode"
version = "0.1.0"
description = "A bunch of agents all working together to build some software."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "quart>=0.22",
    "hypercorn>=0.18",
    "httpx>=0.28",
    "msgpack>=1.1",
]

[project.scripts]
localcode = "localcode.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "localcode"
